name: prestamos-pc3-postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-prestamos
    environment:
      POSTGRES_DB: prestamos_correo
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apppass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../db/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres-worker:
    build:
      context: ../../services/postgres_worker
    container_name: nodo-postgres-nodejs
    environment:
      DB_HOST: postgres
      DB_NAME: prestamos_correo
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-apppass}
      RABBIT_HOST: ${RABBIT_HOST}
      RABBIT_PORT: ${RABBIT_PORT:-15672}
      RABBIT_USER: ${RABBIT_USER:-admin}
      RABBIT_PASS: ${RABBIT_PASS:-adminpass}
      HTTP_PORT: 8002
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8002"
    restart: unless-stopped

volumes:
  postgres_data:
