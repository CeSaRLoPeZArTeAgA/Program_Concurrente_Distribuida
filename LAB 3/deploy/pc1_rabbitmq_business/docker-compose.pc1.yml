name: prestamos-pc1
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq-prestamos
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-adminpass}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  business-api:
    build:
      context: ../../services/business_api
    container_name: business-api-pc1
    environment:
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 15672
      RABBIT_USER: ${RABBIT_USER:-admin}
      RABBIT_PASS: ${RABBIT_PASS:-adminpass}
      API_PORT: ${API_PORT:-8080}
      DATA_FILE: /data/requests.json
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - business_api_data:/data
    restart: unless-stopped

volumes:
  rabbitmq_data:
  business_api_data:
